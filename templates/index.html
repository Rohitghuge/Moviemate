<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MovieMate</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  html, body { scrollbar-width: none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }
  body {
    background: linear-gradient(135deg, #0f9b8e, #142850);
    background-size: 200% 200%;
    min-height: 100vh;
    color: #f5f5f5;
    font-family: 'Segoe UI', sans-serif;
    transition: background 1.2s ease;
    animation: bgPulse 8s ease-in-out infinite, flicker 5.5s ease-in-out infinite;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    background-size: 200% 200%;
    transition: opacity 1.4s ease, background 1.4s ease;
    animation: moodDrift 10s ease-in-out infinite;
  }
  body.mood-love::before { opacity: 1; background: linear-gradient(135deg, #ff3f9f, #ff9bd7); }
  body.mood-happy::before { opacity: 1; background: linear-gradient(135deg, #00d9ff, #1769ff); }
  body.mood-sad::before { opacity: 1; background: linear-gradient(135deg, #101a5c, #54209b); }
  body.mood-action::before { opacity: 1; background: linear-gradient(135deg, #ff8a00, #f51b3b); }
  body.mood-horror::before { opacity: 1; background: linear-gradient(135deg, #210008, #720d2c 52%, #3f0b68); }
  body.mood-surprise::before { opacity: 1; background: linear-gradient(135deg, #ff647c, #ff9f43, #7956d8); }
  @keyframes moodDrift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @keyframes bgPulse {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @keyframes flicker {
    0%, 100% { filter: brightness(1) saturate(1); }
    50% { filter: brightness(1.18) saturate(1.2); }
  }
  body.mood-love, body.mood-happy, body.mood-sad, body.mood-action, body.mood-horror, body.mood-surprise { background: linear-gradient(135deg, #0f9b8e, #142850); }

  .deco-shape {
    position: fixed; color: rgba(255,255,255,0.28); pointer-events: none;
    animation: floatShape 8s ease-in-out infinite; z-index: 0;
  }
  .shape1 { top: 8%; left: 4%; font-size: 20px; animation-delay: 0s; }
  .shape2 { top: 14%; right: 6%; font-size: 13px; animation-delay: 1.5s; }
  .shape3 { bottom: 18%; left: 8%; font-size: 13px; animation-delay: 3s; }
  .shape4 { bottom: 10%; right: 7%; font-size: 20px; animation-delay: 4.5s; }
  @keyframes floatShape {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }

  .app-wrap { width: 100%; margin: 0 auto; padding: 18px clamp(12px, 2vw, 28px); position: relative; z-index: 1; }
  .brand { text-align: center; margin-bottom: 20px; }
  .brand h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 2.8rem;
    color: #ff5fc1;
    text-shadow: 0 0 20px rgba(255,110,199,0.75), 0 0 44px rgba(255,110,199,0.35);
    margin-bottom: 6px;
  }
  .brand p { letter-spacing: 3px; font-size: 0.8rem; color: rgba(255,255,255,0.65); text-transform: uppercase; }

  .card-glass {
    background: rgba(20, 20, 40, 0.45);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 18px;
    backdrop-filter: blur(8px);
    animation: fadeInUp 0.6s ease;
  }
  .workspace { display: flex; gap: 18px; align-items: stretch; width: 100%; min-height: calc(100vh - 100px); }
  .main-column { flex: 1 1 800px; min-width: 0; min-height: calc(100vh - 100px); display: flex; flex-direction: column; }
  .watchlist-panel {
    display: none; order: -1; flex: 0 0 255px; position: sticky; top: 20px; max-height: calc(100vh - 40px);
    overflow-y: auto; padding: 16px; background: rgba(20, 20, 40, 0.5);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 16px; backdrop-filter: blur(8px);
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.04) transparent;
  }
  .watchlist-panel.visible { display: block; }
  .watchlist-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .watchlist-heading h2 { font-size: 1rem; margin: 0; }
  .watchlist-count { min-width: 22px; padding: 2px 7px; border-radius: 12px; background: rgba(255,255,255,0.14); text-align: center; font-size: 11px; }
  .watchlist-empty { color: rgba(255,255,255,0.6); font-size: 12px; line-height: 1.45; }
  .watchlist-item { display: flex; gap: 9px; padding: 9px 0; border-top: 1px solid rgba(255,255,255,0.1); }
  .watchlist-item img, .watchlist-no-poster { width: 44px; height: 62px; flex: 0 0 44px; object-fit: cover; border-radius: 5px; background: rgba(255,255,255,0.1); }
  .watchlist-no-poster { display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.5); font-size: 9px; text-align: center; }
  .watchlist-item-content { min-width: 0; flex: 1; }
  .watchlist-item-title { font-size: 12px; font-weight: 700; line-height: 1.25; margin-bottom: 4px; }
  .watchlist-item-meta { color: rgba(255,255,255,0.6); font-size: 10px; margin-bottom: 6px; }
  .watchlist-remove { padding: 2px 6px; border: 1px solid rgba(255,255,255,0.2); border-radius: 5px; background: transparent; color: rgba(255,255,255,0.75); font-size: 10px; }
  .watchlist-remove:hover { background: rgba(255,255,255,0.12); }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .auth-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab-btn {
    flex: 1; padding: 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.7); font-weight: 600; transition: all 0.35s ease;
  }
  .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.14); transform: translateY(-2px); }
  .tab-btn.active { background: linear-gradient(135deg, #ff5fc1, #7b5cff); border-color: transparent; color: #fff; box-shadow: 0 8px 20px rgba(123,92,255,0.35); }

  .location-btn {
    width: 100%; padding: 9px; border-radius: 30px;
    border: 1px solid rgba(157,140,255,0.5);
    background: rgba(157,140,255,0.12);
    color: #d9d2ff; font-weight: 600; transition: all 0.25s ease;
  }
  .location-btn:hover { background: rgba(157,140,255,0.22); }
  .location-btn.detecting { animation: pulseGlow 1.2s infinite; }
  .location-btn.detected { background: rgba(56,255,157,0.15); border-color: #38ff9d; color: #c9ffe4; }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 0px rgba(157,140,255,0.4); }
    50% { box-shadow: 0 0 14px rgba(157,140,255,0.7); }
  }

  #chat-window {
    height: clamp(380px, calc(100vh - 270px), 520px); overflow-y: auto; padding: 8px;
    display: flex; flex-direction: column; gap: 12px;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.04) transparent;
  }
  #chat-card { height: calc(100vh - 118px); min-height: 0; display: flex; flex-direction: column; }
  #chat-card #chat-window { flex: 1 1 auto; min-height: 0; }
  #chat-card .mood-chips, #chat-card #chat-form { flex-shrink: 0; }
  #chat-window::-webkit-scrollbar, .movie-grid::-webkit-scrollbar, .watchlist-panel::-webkit-scrollbar { width: 8px; height: 8px; }
  #chat-window::-webkit-scrollbar-track, .movie-grid::-webkit-scrollbar-track, .watchlist-panel::-webkit-scrollbar-track { background: transparent; }
  #chat-window::-webkit-scrollbar-thumb, .movie-grid::-webkit-scrollbar-thumb, .watchlist-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.04); border-radius: 10px; }
  #chat-window::-webkit-scrollbar-thumb:hover, .movie-grid::-webkit-scrollbar-thumb:hover, .watchlist-panel::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.08); }

  .msg {
    max-width: 85%; padding: 10px 14px; border-radius: 14px;
    white-space: pre-wrap; line-height: 1.4; font-size: 14.5px;
    animation: fadeInUp 0.35s ease;
  }
  #auth-card {
    position: relative;
    overflow: hidden;
    background: linear-gradient(145deg, rgba(22, 42, 73, 0.82), rgba(27, 87, 105, 0.58));
    box-shadow: 0 18px 50px rgba(4, 19, 42, 0.28), inset 0 1px rgba(255,255,255,0.12);
  }
  #auth-card::before {
    content: '';
    position: absolute;
    width: 180px;
    height: 180px;
    top: -100px;
    right: -55px;
    border-radius: 50%;
    background: rgba(255, 95, 193, 0.2);
    filter: blur(8px);
    pointer-events: none;
    animation: authGlow 5s ease-in-out infinite alternate;
  }
  #auth-card > * { position: relative; z-index: 1; }
  @keyframes authGlow {
    from { transform: translate(0, 0) scale(0.9); opacity: 0.55; }
    to { transform: translate(-35px, 35px) scale(1.2); opacity: 0.9; }
  }
  .msg.user { align-self: flex-end; background: #7b5cff; color: white; border-bottom-right-radius: 4px; }
  .msg.bot  { align-self: flex-start; background: rgba(255,255,255,0.1); border-bottom-left-radius: 4px; }
  .msg.bot a { color: #9d8cff; text-decoration: none; }
  .msg.bot a:hover { color: #ff6ec7; }
  .msg.bot .no-trailer { opacity: 0.5; font-style: italic; }

  .movie-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; overflow: visible; padding: 6px 2px 12px 2px;
    width: 100%; min-width: 0; align-self: stretch; animation: fadeInUp 0.4s ease;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.04) transparent;
  }
  .movie-result-group {
    width: 100%; min-width: 0; flex: 0 0 auto;
  }
  .movie-result-label {
    margin: 0 2px 2px; color: rgba(255,255,255,0.6); font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .movie-card {
    width: 100%; min-width: 0;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px; overflow: hidden; font-size: 11.5px;
    transition: transform 0.2s ease;
  }
  .movie-card:hover { transform: translateY(-4px); }
  .poster-wrap { position: relative; }
  .poster-wrap img { width: 100%; aspect-ratio: 3 / 4; height: auto; object-fit: cover; display: block; background: rgba(255,255,255,0.08); }
  .poster-wrap .no-poster {
    width: 100%; aspect-ratio: 3 / 4; height: auto; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.4); text-align: center; padding: 6px; font-size: 10px;
  }
  .cert-badge {
    position: absolute; top: 6px; right: 6px; font-size: 9px; font-weight: 700;
    padding: 2px 6px; border-radius: 5px; color: white;
  }
  .cert-badge.cert-green { background: #2ecc71; }
  .cert-badge.cert-orange { background: #f39c12; }
  .cert-badge.cert-red { background: #e74c3c; }
  .card-body { padding: 8px 9px; }
  .card-title { font-weight: 700; margin-bottom: 3px; line-height: 1.25; max-height: 2.5em; overflow: hidden; }
  .card-overview { color: rgba(255,255,255,0.68); line-height: 1.35; margin-bottom: 7px; height: 2.7em; overflow: hidden; }
  .card-genres { opacity: 0.6; font-size: 10px; margin-bottom: 5px; max-height: 1.3em; overflow: hidden; }
  .card-provider { opacity: 0.72; font-size: 10px; line-height: 1.3; margin-bottom: 6px; overflow-wrap: anywhere; }
  .platform-badges { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-bottom: 6px; min-height: 18px; }
  .platform-badge-item { display: flex; align-items: center; gap: 3px; }
  .platform-badge { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 4px; font-size: 9.5px; font-weight: 800; color: #fff; flex: 0 0 auto; line-height: 1; }
  .platform-badge-name { font-size: 9px; opacity: 0.78; }
  .platform-none { font-size: 10px; opacity: 0.55; font-style: italic; }
  .card-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 10.5px; }
  .card-meta .rating { color: #ffd166; font-weight: 700; }
  .card-actions { display: flex; gap: 4px; }
  .card-actions a, .card-actions button, .card-actions .trailer-control, .card-actions .watch-now-control {
    flex: 1; font-size: 9.5px; text-align: center; padding: 4px 0; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #f5f5f5;
    text-decoration: none; transition: transform 0.15s ease;
  }
  .card-actions a:hover, .card-actions button:hover, .card-actions .trailer-control:hover, .card-actions .watch-now-control:hover { transform: scale(1.05); background: rgba(255,255,255,0.16); }
  .card-actions .no-trailer-btn { opacity: 0.35; pointer-events: none; }
  .card-actions .watch-now-btn { background: rgba(46,204,113,0.18); border-color: rgba(46,204,113,0.5); }
  .card-actions .watch-now-btn:hover { background: rgba(46,204,113,0.3); }
  .watch-now-wrap { position: relative; flex: 1; }
  .watch-menu {
    position: absolute; bottom: calc(100% + 4px); left: 0; right: 0; z-index: 5;
    background: rgba(20,20,40,0.96); border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px; padding: 4px; display: flex; flex-direction: column; gap: 2px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }
  .watch-menu-item {
    font-size: 10px; padding: 5px 6px; border-radius: 5px; border: none;
    background: transparent; color: #f5f5f5; text-align: left; width: 100%;
  }
  .watch-menu-item:hover { background: rgba(255,255,255,0.14); }

  .mood-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .mood-chip {
    --chip-color: #9d8cff;
    font-size: 11.5px; padding: 5px 12px; border-radius: 20px;
    border: 1px solid color-mix(in srgb, var(--chip-color) 65%, white 35%);
    background: color-mix(in srgb, var(--chip-color) 16%, transparent);
    color: #fff; transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  .mood-chip:hover, .mood-chip:focus-visible {
    transform: translateY(-1px);
    background: color-mix(in srgb, var(--chip-color) 30%, transparent);
    box-shadow: 0 0 14px color-mix(in srgb, var(--chip-color) 55%, transparent);
  }
  .mood-chip.selected {
    background: var(--chip-color);
    border-color: #fff;
    box-shadow: 0 0 18px color-mix(in srgb, var(--chip-color) 70%, transparent);
    transform: translateY(-2px) scale(1.03);
  }
  .mood-chip[data-text*="happy"] { --chip-color: #00bfff; }
  .mood-chip[data-text*="sad"] { --chip-color: #382b9e; }
  .mood-chip[data-text*="action"] { --chip-color: #ff5a27; }
  .mood-chip[data-text*="romantic"] { --chip-color: #ff5ca8; }
  .mood-chip[data-text*="horror"] { --chip-color: #8d1742; }
  .mood-chip[data-text*="Surprise me"] { --chip-color: #e87868; }

  .typing-dots { align-self: flex-start; display: flex; gap: 4px; padding: 10px 14px; }
  .typing-dots span {
    width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.6);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  #chat-form { display: none; }
  .form-control { background: rgba(255,255,255,0.08); color: white; border: 1px solid rgba(255,255,255,0.2); }
  .form-control option { background: #28576a; color: #ffffff; }
  .form-control option:checked, .form-control option:hover { background: #2167c7; color: #ffffff; }
  .auth-form { animation: formReveal 0.4s ease both; }
  @keyframes formReveal {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .form-control { background: rgba(255,255,255,0.08); color: white; border: 1px solid rgba(255,255,255,0.2); transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease; }
  .form-control:hover { background: rgba(255,255,255,0.13); border-color: rgba(255,255,255,0.35); }
  .form-control:focus { background: rgba(255,255,255,0.15); color: white; box-shadow: 0 0 0 3px rgba(255,95,193,0.16); border-color: #ff5fc1; }
  .btn-primary { background: linear-gradient(135deg, #ff5fc1, #7b5cff); border: none; transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease; }
  .btn-primary:hover { background: linear-gradient(135deg, #ff72ca, #896eff); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(123,92,255,0.35); filter: saturate(1.15); }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; }
  .chat-status { min-height: 18px; color: rgba(255,255,255,0.72); font-size: 12px; margin: 0 12px 4px; }
  .empty-results { align-self: stretch; padding: 16px; border: 1px dashed rgba(255,255,255,0.25); border-radius: 12px; color: rgba(255,255,255,0.75); font-size: 13px; }
  .logout-btn {
    font-size: 11px; padding: 3px 10px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #f5f5f5;
  }
  @media (max-width: 576px) {
    .app-wrap { padding: 20px 10px; }
    .card-glass { padding: 16px; }
    #chat-window { height: min(520px, calc(100vh - 150px)); padding: 8px 4px; }
    #chat-card { height: calc(100vh - 110px); }
    .msg { max-width: 92%; }
    .movie-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
  }
  @media (min-width: 861px) and (max-height: 800px) {
    .app-wrap { padding-top: 12px; }
    .brand { margin-bottom: 12px; }
    .brand h1 { font-size: 2.35rem; margin-bottom: 2px; }
    .card-glass { padding: 14px; }
    #chat-window { height: clamp(360px, calc(100vh - 250px), 430px); }
  }
  @media (max-width: 860px) {
    .workspace { display: block; min-height: 0; }
    .main-column { min-height: 0; }
    .watchlist-panel { position: static; max-height: none; margin-top: 18px; }
  }
  @media (min-width: 861px) and (max-width: 1180px) {
    .app-wrap { padding-left: 14px; padding-right: 14px; }
    .watchlist-panel { flex-basis: 220px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div class="deco-shape shape1">&#10052;</div>
<div class="deco-shape shape2">&#9675;</div>
<div class="deco-shape shape3">&#9675;</div>
<div class="deco-shape shape4">&#10052;</div>

<div class="app-wrap">
  <div class="brand">
    <h1>MovieMate</h1>
    <p>Find the right movie for every mood</p>
  </div>

  <div class="workspace">
  <main class="main-column">
  <div class="card-glass" id="auth-card">
    <div class="auth-tabs">
      <button type="button" class="tab-btn active" data-tab="login">Log In</button>
      <button type="button" class="tab-btn" data-tab="signup">Sign Up</button>
    </div>

    <form id="login-form" class="auth-form">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" id="login-username" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="login-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Log In</button>
      <div id="login-error" class="text-danger mt-2" style="display:none;"></div>
      <p class="text-center mt-2" style="font-size:12px;">
        <a href="#" id="forgot-link" style="color:#9d8cff; text-decoration:none;">Forgot password?</a>
      </p>
    </form>

    <form id="signup-form" class="auth-form" style="display:none;">
      <div class="mb-3">
        <label class="form-label">Choose a username</label>
        <input type="text" class="form-control" id="signup-username" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Choose a password</label>
        <input type="password" class="form-control" id="signup-password" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Your age</label>
        <input type="number" class="form-control" id="signup-age" min="1" max="120" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Security question (for password recovery)</label>
        <select class="form-control" id="signup-question" required>
          <option value="">Select a question</option>
          <option>What is your pet's name?</option>
          <option>What is your mother's maiden name?</option>
          <option>What was the name of your first school?</option>
          <option>What is your favorite movie?</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Answer</label>
        <input type="text" class="form-control" id="signup-answer" required>

<script>
const authCard = document.getElementById('auth-card');
const setupCard = document.getElementById('setup-card');
const chatCard = document.getElementById('chat-card');
const chatForm = document.getElementById('chat-form');
const chatWindow = document.getElementById('chat-window');
const chatInput = document.getElementById('chat-input');
const chatStatus = document.getElementById('chat-status');
const watchlistPanel = document.getElementById('watchlist-panel');
const watchlistItems = document.getElementById('watchlist-items');
const watchlistCount = document.getElementById('watchlist-count');

let travelMode = false;
let currentUsername = null;
let cachedLocationName = null;
let detectedState = null;
const watchlistMovies = new Map();

// ---------- Mood background ----------
const LOVE_WORDS = ["love", "romance", "romantic", "date night"];
const HAPPY_WORDS = ["happy", "feel good", "feelgood", "refreshing", "fun", "cheerful", "uplifting", "funny", "comedy", "lighthearted"];
const SAD_WORDS = ["sad", "comforting", "comfort", "emotional", "melancholy"];
const ACTION_WORDS = ["action", "fight", "intense", "adrenaline", "war", "battle"];
const HORROR_WORDS = ["horror", "scary", "fear", "spooky", "creepy", "haunted", "thriller"];
const SURPRISE_WORDS = ["surprise me", "something great"];

function updateMoodBackground(text) {
  const q = text.toLowerCase();
  document.body.classList.remove('mood-love', 'mood-happy', 'mood-sad', 'mood-action', 'mood-horror', 'mood-surprise');
  if (LOVE_WORDS.some(w => q.includes(w))) document.body.classList.add('mood-love');
  else if (ACTION_WORDS.some(w => q.includes(w))) document.body.classList.add('mood-action');
  else if (HORROR_WORDS.some(w => q.includes(w))) document.body.classList.add('mood-horror');
  else if (SAD_WORDS.some(w => q.includes(w))) document.body.classList.add('mood-sad');
  else if (SURPRISE_WORDS.some(w => q.includes(w))) document.body.classList.add('mood-surprise');
  else if (HAPPY_WORDS.some(w => q.includes(w))) document.body.classList.add('mood-happy');
}

// ---------- Location ----------
function detectLocation() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        try {
          const { latitude, longitude } = pos.coords;
          const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
          const geoData = await geoRes.json();
          const addr = geoData.address || {};
          const place = addr.city || addr.town || addr.village || addr.state || addr.country || null;
          cachedLocationName = place;
          detectedState = addr.state || null;
          resolve(place);
        } catch (err) { resolve(null); }
      },
      () => resolve(null),
      { timeout: 8000 }
    );
  });
}

document.getElementById('location-btn').addEventListener('click', async () => {
  const btn = document.getElementById('location-btn');
  btn.classList.add('detecting');
  btn.textContent = 'Detecting...';
  const place = await detectLocation();
  btn.classList.remove('detecting');
  if (place) {
    btn.classList.add('detected');
    btn.textContent = `Location: ${place}`;
  } else {
    btn.textContent = 'Location unavailable — tap to retry';
  }
});

const LOCATION_QUERY_PATTERNS = ["where am i", "my location", "where i am", "current location", "what's my location"];
function isLocationQuery(text) {
  const q = text.toLowerCase();
  return LOCATION_QUERY_PATTERNS.some(p => q.includes(p));
}

// ---------- Auth tabs ----------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('signup-form').style.display = tab === 'signup' ? 'block' : 'none';
  });
});

function onAuthSuccess(username, state = {}) {
  currentUsername = username;
  travelMode = Boolean(state.travel_mode);
  authCard.style.display = 'none';
  document.getElementById('welcome-username').textContent = username;
  document.getElementById('chat-username').textContent = username;
  document.getElementById('travel-input').checked = travelMode;
  watchlistPanel.classList.add('visible');
  loadWatchlist();
  if (state.has_started) {
    setupCard.style.display = 'none';
    chatCard.style.display = 'block';
    chatForm.style.display = 'flex';
  } else {
    setupCard.style.display = 'block';
  }
}

function renderWatchlist() {
  watchlistCount.textContent = watchlistMovies.size;
  watchlistItems.innerHTML = '';
  if (watchlistMovies.size === 0) {
    const empty = document.createElement('p');
    empty.className = 'watchlist-empty';
    empty.textContent = 'Save movies here while you browse. They will stay with your account.';
    watchlistItems.appendChild(empty);
    return;
  }
  watchlistMovies.forEach(movie => {
    const item = document.createElement('div');
    item.className = 'watchlist-item';
    if (movie.poster_path) {
      const image = document.createElement('img');
      image.src = POSTER_BASE + movie.poster_path;
      image.alt = `${movie.title} poster`;
      image.loading = 'lazy';
      item.appendChild(image);
    } else {
      const noPoster = document.createElement('div');
      noPoster.className = 'watchlist-no-poster';
      noPoster.textContent = 'No image';
      item.appendChild(noPoster);
    }
    const content = document.createElement('div');
    content.className = 'watchlist-item-content';
    const title = document.createElement('div');
    title.className = 'watchlist-item-title';
    title.textContent = movie.title;
    const meta = document.createElement('div');
    meta.className = 'watchlist-item-meta';
    meta.textContent = `${(movie.release_date || '').slice(0, 4) || 'Year n/a'} · ★ ${movie.rating ? Number(movie.rating).toFixed(1) : '–'}`;
    const removeButton = document.createElement('button');
    removeButton.type = 'button';
    removeButton.className = 'watchlist-remove';
    removeButton.textContent = 'Remove';
    removeButton.addEventListener('click', () => removeWatchlistMovie(movie.id));
    content.append(title, meta, removeButton);
    item.appendChild(content);
    watchlistItems.appendChild(item);
  });
}

async function loadWatchlist() {
  try {
    const res = await fetch('/watchlist');
    if (!res.ok) return;
    const data = await readJsonResponse(res, 'Watchlist');
    watchlistMovies.clear();
    (data.movies || []).forEach(movie => watchlistMovies.set(String(movie.id), movie));
    renderWatchlist();
  } catch (err) {
    console.warn('Could not load watchlist:', err);
  }
}

async function readJsonResponse(res, label = 'Request') {
  const contentType = res.headers.get('content-type') || '';
  if (!contentType.includes('application/json')) {
    throw new Error(`${label} request failed with HTTP ${res.status}. Check the Render service logs.`);
  }
  return res.json();
}

async function readChatResponse(res) {
  const contentType = res.headers.get('content-type') || '';
  if (contentType.includes('application/json')) return res.json();
  const message = (await res.text()).trim();
  throw new Error(message || `Server returned HTTP ${res.status}. Check the Render logs for the backend error.`);
}

async function addWatchlistMovie(movie, button, card) {
  button.disabled = true;
  button.textContent = 'Saving...';
  try {
    const res = await fetch('/watchlist', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(movie)
    });
    const data = await readChatResponse(res);
    if (!res.ok) throw new Error(data.error || 'Could not save this movie.');
    watchlistMovies.set(String(movie.id), movie);
    renderWatchlist();
    card.classList.add('watchlisted');
    button.textContent = 'In list';
  } catch (err) {
    button.disabled = false;
    button.textContent = 'Add to list';
    chatStatus.textContent = err.message || 'Could not save this movie.';
  }
}

async function removeWatchlistMovie(movieId) {
  try {
    const res = await fetch(`/watchlist/${encodeURIComponent(movieId)}`, {method: 'DELETE'});
    const data = await readChatResponse(res);
    if (!res.ok) throw new Error(data.error || 'Could not remove this movie.');
    watchlistMovies.delete(String(movieId));
    renderWatchlist();
    document.querySelectorAll(`[data-movie-id="${CSS.escape(String(movieId))}"] .watchlist-btn`).forEach(button => {
      button.disabled = false;
      button.textContent = 'Add to list';
    });
  } catch (err) {
    chatStatus.textContent = err.message || 'Could not remove that movie.';
  }
}

// Free-tier honest limit: no platform gives a public, free way to deep-link
// straight into a specific title's player page just from a guessed search
// URL (that's why "Amazon Prime" used to just land on Prime's generic video
// page). TMDB's own watch/providers "link" is the real fix: it's a
// JustWatch-powered page built for this exact movie, and clicking a
// platform there opens a genuine deep link into that title. We fetch that
// live (see loadTrailers/providers below) and use it as the single
// "Watch Now" target instead of guessing.
const PLATFORM_SEARCH_URLS = {
  'netflix': (t) => `https://www.netflix.com/search?q=${encodeURIComponent(t)}`,
  'amazon prime video': (t) => `https://www.amazon.in/s?k=${encodeURIComponent(t)}&i=instant-video`,
  'amazon prime video with ads': (t) => `https://www.amazon.in/s?k=${encodeURIComponent(t)}&i=instant-video`,
  'jiohotstar': (t) => `https://www.hotstar.com/in/search?q=${encodeURIComponent(t)}`,
  'disney plus hotstar': (t) => `https://www.hotstar.com/in/search?q=${encodeURIComponent(t)}`,
  'zee5': (t) => `https://www.zee5.com/search?q=${encodeURIComponent(t)}`,
  'sonyliv': (t) => `https://www.sonyliv.com/search?searchTerm=${encodeURIComponent(t)}`,
  'apple tv': (t) => `https://tv.apple.com/search?term=${encodeURIComponent(t)}`,
  'apple tv plus': (t) => `https://tv.apple.com/search?term=${encodeURIComponent(t)}`,
  'google play movies': (t) => `https://play.google.com/store/search?q=${encodeURIComponent(t)}&c=movies`,
  'youtube': (t) => `https://www.youtube.com/results?search_query=${encodeURIComponent(t + ' full movie')}`,
};

function buildPlatformSearchUrl(provider, title) {
  const key = provider.toLowerCase().trim();
  if (PLATFORM_SEARCH_URLS[key]) return PLATFORM_SEARCH_URLS[key](title);
  return `https://www.google.com/search?q=${encodeURIComponent('watch ' + title + ' on ' + provider)}`;
}

// Colored brand-initial badges, applied the same way to every platform.
const PLATFORM_STYLES = {
  'netflix': { letter: 'N', bg: '#E50914' },
  'amazon prime video': { letter: 'P', bg: '#00A8E1' },
  'amazon prime video with ads': { letter: 'P', bg: '#00A8E1' },
  'jiohotstar': { letter: 'H', bg: '#0F1A2B' },
  'disney plus hotstar': { letter: 'H', bg: '#0F1A2B' },
  'zee5': { letter: 'Z', bg: '#6C2EB5' },
  'sonyliv': { letter: 'S', bg: '#00B4D8' },
  'apple tv': { letter: '', bg: '#1a1a1a' },
  'apple tv plus': { letter: '', bg: '#1a1a1a' },
  'google play movies': { letter: '▶', bg: '#00A853' },
  'youtube': { letter: '▶', bg: '#FF0000' },
};

function platformStyleFor(name) {
  const key = (name || '').toLowerCase().trim();
  if (PLATFORM_STYLES[key]) return PLATFORM_STYLES[key];
  return { letter: (name || '?').trim().charAt(0).toUpperCase() || '?', bg: '#5a5a7a' };
}

function platformBadge(name) {
  const style = platformStyleFor(name);
  const wrap = document.createElement('span');
  wrap.className = 'platform-badge-item';
  const dot = document.createElement('span');
  dot.className = 'platform-badge';
  dot.style.background = style.bg;
  dot.textContent = style.letter;
  dot.setAttribute('aria-hidden', 'true');
  const label = document.createElement('span');
  label.className = 'platform-badge-name';
  label.textContent = name;
  wrap.append(dot, label);
  return wrap;
}

function renderPlatformBadges(container, providerNames) {
  container.innerHTML = '';
  if (!providerNames || providerNames.length === 0) {
    const none = document.createElement('span');
    none.className = 'platform-none';
    none.textContent = 'Not listed for streaming right now';
    container.appendChild(none);
    return;
  }
  providerNames.forEach(name => container.appendChild(platformBadge(name)));
}

async function markWatched(movieId, movieTitle) {
  // Fire-and-forget: runs when "Watch Now" is clicked, never blocks the new tab opening
  try {
    await fetch('/exclude', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({movie_id: movieId, movie_title: movieTitle})
    });
  } catch (err) {
    // Silent: this is a background convenience action, not critical to the click
  }
}

async function loadTrailers(movies, grid) {
  try {
    const res = await fetch('/trailers', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({movie_ids: movies.map(movie => movie.id)})
    });
    const data = await readJsonResponse(res, 'Trailers');
    if (!res.ok) throw new Error(data.error || 'Could not load trailers.');

    Object.entries(data.trailers || {}).forEach(([movieId, trailerUrl]) => {
      const card = grid.querySelector(`[data-movie-id="${CSS.escape(String(movieId))}"]`);
      const trailerControl = card && card.querySelector('.trailer-control');
      if (!trailerControl) return;
      if (trailerUrl) {
        const trailerLink = document.createElement('a');
        trailerLink.href = trailerUrl;
        trailerLink.target = '_blank';
        trailerLink.rel = 'noopener';
        trailerLink.className = 'trailer-control';
        trailerLink.textContent = '▶ Trailer';
        trailerLink.setAttribute('aria-label', `Watch trailer for ${card.querySelector('.card-title').textContent}`);
        trailerControl.replaceWith(trailerLink);
      } else {
        trailerControl.textContent = 'No trailer';
        trailerControl.classList.add('no-trailer-btn');
      }
    });

    Object.entries(data.providers || {}).forEach(([movieId, info]) => {
      const card = grid.querySelector(`[data-movie-id="${CSS.escape(String(movieId))}"]`);
      if (!card) return;
      const movie = movies.find(m => String(m.id) === String(movieId));
      const title = movie ? movie.title : '';

      const badgesEl = card.querySelector('.platform-badges');
      const liveNames = (info && info.names) || [];
      if (badgesEl && liveNames.length > 0) {
        renderPlatformBadges(badgesEl, liveNames);
      }

      const watchControl = card.querySelector('.watch-now-control');
      if (!watchControl) return;
      const liveLink = info && info.link;
      const fallbackName = liveNames[0];

      if (liveLink || fallbackName) {
        const watchLink = document.createElement('a');
        watchLink.className = 'watch-now-control watch-now-btn';
        watchLink.href = liveLink || buildPlatformSearchUrl(fallbackName, title);
        watchLink.target = '_blank';
        watchLink.rel = 'noopener';
        watchLink.textContent = 'Watch Now';
        watchLink.addEventListener('click', () => markWatched(movieId, title));
        watchControl.replaceWith(watchLink);
      } else {
        watchControl.textContent = 'Not available';
        watchControl.classList.add('no-trailer-btn');
      }
    });

    scrollChatToBottom();
  } catch (err) {
    grid.querySelectorAll('.trailer-control').forEach(control => {
      control.textContent = 'Trailer unavailable';
      control.classList.add('no-trailer-btn');
    });
    grid.querySelectorAll('.watch-now-control').forEach(control => {
      control.textContent = 'Not available';
      control.classList.add('no-trailer-btn');
    });
  }
}

document.getElementById('forgot-step2-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const username = form.dataset.username;
  const answer = document.getElementById('forgot-answer').value.trim();
  const newPassword = document.getElementById('forgot-new-password').value;
  const errDiv = document.getElementById('forgot-step2-error');
  const successDiv = document.getElementById('forgot-success');

  try {
    const res = await fetch('/forgot-password/reset', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, answer, new_password: newPassword})
    });
    const data = await res.json();
    if (!res.ok) {
      errDiv.textContent = data.error || 'Something went wrong.';
      errDiv.style.display = 'block';
      successDiv.style.display = 'none';
      return;
    }
    errDiv.style.display = 'none';
    successDiv.textContent = 'Password reset! Click "Back to Log In" to sign in with your new password.';
    successDiv.style.display = 'block';
  } catch (err) {
    errDiv.textContent = 'Server error, please try again.';
    errDiv.style.display = 'block';
  }
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/logout', {method: 'POST'});
  location.reload();
});

// ---------- Start chatting ----------
document.getElementById('travel-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  travelMode = document.getElementById('travel-input').checked;
  const startButton = e.target.querySelector('button[type="submit"]');
  startButton.disabled = true;
  startButton.textContent = 'Starting...';

  try {
    const res = await fetch('/start', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({travel_mode: travelMode, location_state: detectedState})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not start the chat.');

    setupCard.style.display = 'none';
    chatCard.style.display = 'block';
    chatForm.style.display = 'flex';
    chatWindow.innerHTML = '';
    addMessage(`Hey ${currentUsername}! Tell me what you're in the mood to watch — or try 'movies like [a movie you love]'.`, 'bot');

    if (travelMode) {
      if (cachedLocationName) {
        addMessage(`I'll keep picks light and easy since you're near ${cachedLocationName} and travelling!`, 'bot');
      } else {
        addMessage("Travel mode is on — I'll keep picks light and easy for your trip!", 'bot');
      }
    }
  } catch (err) {
    chatStatus.textContent = err.message || 'Could not start the chat. Please try again.';
  } finally {
    startButton.disabled = false;
    startButton.textContent = 'Start Chatting';
  }
});

// ---------- Message rendering ----------
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatBotText(text) {
  let out = escapeHtml(text);
  out = out.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/\*(.*?)\*/g, '<em>$1</em>');
  out = out.replace(/\n/g, '<br>');
  return out;
}

function certClass(cert) {
  const c = (cert || '').toUpperCase();
  if (c.includes('18') || c === 'A' || c.includes('NC-17')) return 'cert-red';
  if (c.includes('16') || c.includes('13') || c === 'R') return 'cert-orange';
  return 'cert-green';
}

const POSTER_BASE = "https://image.tmdb.org/t/p/w300";

function addMovieGrid(movies) {
  if (!movies || movies.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-results';
    empty.textContent = 'No new matches came back for that request. Try a broader mood, genre, or title.';
    chatWindow.appendChild(empty);
    scrollChatToBottom();
    return;
  }
  const group = document.createElement('section');
  group.className = 'movie-result-group';
  group.setAttribute('aria-label', 'Movie recommendations');
  const label = document.createElement('div');
  label.className = 'movie-result-label';
  label.textContent = 'Recommendations';
  group.appendChild(label);

  const grid = document.createElement('div');
  grid.className = 'movie-grid';

  movies.forEach(m => {
    const card = document.createElement('div');
    card.className = 'movie-card';
    card.dataset.movieId = String(m.id);

    const posterWrap = document.createElement('div');
    posterWrap.className = 'poster-wrap';
    if (m.poster_path) {
      const image = document.createElement('img');
      image.src = POSTER_BASE + m.poster_path;
      image.alt = `${m.title || 'Movie'} poster`;
      image.loading = 'lazy';
      posterWrap.appendChild(image);
    } else {
      const noPoster = document.createElement('div');
      noPoster.className = 'no-poster';
      noPoster.textContent = 'No image';
      posterWrap.appendChild(noPoster);
    }
    const badge = document.createElement('span');
    badge.className = `cert-badge ${certClass(m.certification)}`;
    badge.textContent = m.certification || 'NR';
    posterWrap.appendChild(badge);

    const body = document.createElement('div');
    body.className = 'card-body';
    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = m.title || 'Untitled movie';
    const genres = document.createElement('div');
    genres.className = 'card-genres';
    genres.textContent = m.genres || 'Genre not listed';
    const overview = document.createElement('div');
    overview.className = 'card-overview';
    overview.textContent = m.overview || 'A recommendation from your MovieMate catalog.';
    overview.title = m.overview || '';
    const meta = document.createElement('div');
    meta.className = 'card-meta';
    const rating = document.createElement('span');
    rating.className = 'rating';
    rating.textContent = `★ ${m.rating ? Number(m.rating).toFixed(1) : '–'}`;
    const year = document.createElement('span');
    year.textContent = (m.release_date || '').slice(0, 4) || 'Year n/a';
    meta.append(rating, year);

    const providerBadges = document.createElement('div');
    providerBadges.className = 'platform-badges';
    const initialProviderNames = (m.watch_providers || '')
      .split(',').map(p => p.trim()).filter(Boolean);
    renderPlatformBadges(providerBadges, initialProviderNames);

    const actions = document.createElement('div');
    actions.className = 'card-actions';

    const trailer = document.createElement('span');
    trailer.className = 'trailer-control';
    trailer.textContent = 'Loading...';
    actions.appendChild(trailer);

    const watchlistButton = document.createElement('button');
    watchlistButton.type = 'button';
    watchlistButton.className = 'watchlist-btn';
    watchlistButton.textContent = watchlistMovies.has(String(m.id)) ? 'In list' : 'Add to list';
    watchlistButton.disabled = watchlistMovies.has(String(m.id));
    watchlistButton.addEventListener('click', () => addWatchlistMovie(m, watchlistButton, card));
    actions.appendChild(watchlistButton);

    // Placeholder until /trailers resolves with the live TMDB/JustWatch
    // link for this exact movie — same pattern as the trailer placeholder,
    // so Watch Now always points at a real deep-link page, not a guess.
    const watchNow = document.createElement('span');
    watchNow.className = 'watch-now-control';
    watchNow.textContent = 'Loading...';
    actions.appendChild(watchNow);

    body.append(title, genres, overview, meta, providerBadges, actions);
    card.append(posterWrap, body);

    grid.appendChild(card);
  });

  group.appendChild(grid);
  chatWindow.appendChild(group);
  // Poster images load asynchronously and grow the layout after this point,
  // so scroll again once each one finishes (in addition to the deferred
  // scroll below) to keep the latest content flush at the bottom.
  grid.querySelectorAll('img').forEach(img => {
    img.addEventListener('load', scrollChatToBottom, { once: true });
  });
  scrollChatToBottom();
  loadTrailers(movies, grid);
}

function addMessage(text, sender) {
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  if (sender === 'bot') {
    div.innerHTML = formatBotText(text);
  } else {
    div.textContent = text;
  }
  chatWindow.appendChild(div);
  scrollChatToBottom();
  return div;
}

function scrollChatToBottom() {
  // Direct scrollTop assignment, deferred one frame so layout (including
  // any still-loading poster images above) has settled first. This sits
  // flush at the true bottom, unlike scrollIntoView which can stop short.
  requestAnimationFrame(() => {
    chatWindow.scrollTop = chatWindow.scrollHeight;
  });
}

function addTypingIndicator() {
  const div = document.createElement('div');
  div.className = 'typing-dots';
  div.innerHTML = '<span></span><span></span><span></span>';
  chatWindow.appendChild(div);
  scrollChatToBottom();
  return div;
}

async function sendChatMessage(text) {
  addMessage(text, 'user');
  updateMoodBackground(text);

  if (isLocationQuery(text)) {
    const typingDiv = addTypingIndicator();
    const place = cachedLocationName || await detectLocation();
    typingDiv.remove();
    if (place) {
      addMessage(`You're currently near ${place}.`, 'bot');
    } else {
      addMessage("I couldn't detect your location — make sure location access is allowed for this site in your browser settings, then ask again.", 'bot');
    }
    return;
  }

  const sendBtn = chatForm.querySelector('button[type="submit"]');
  sendBtn.disabled = true;
  sendBtn.textContent = '...';
  chatStatus.textContent = 'Finding a few good matches...';

  const typingDiv = addTypingIndicator();

  try {
    const res = await fetch('/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });
    const data = await readJsonResponse(res, 'Chat');
    typingDiv.remove();

    if (!res.ok) {
      addMessage('Error: ' + (data.error || 'Something went wrong.'), 'bot');
      return;
    }

    if (!data.is_info) {
      addMovieGrid(data.movies);
      if (data.blocked_count && (!data.movies || data.movies.length === 0)) {
        chatStatus.textContent = 'Some matches were filtered by your age setting or what you have already seen.';
      } else {
        chatStatus.textContent = 'Movies found. Writing your personal note...';
      }
    } else {
      chatStatus.textContent = 'Writing more detail...';
    }
    await loadChatReply(data.response_token);
  } catch (err) {
    typingDiv.remove();
    addMessage(`Error: ${err.message || 'The request failed.'}`, 'bot');
    chatStatus.textContent = 'The chat request failed. Check the Render logs for details.';
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = 'Send';
  }
}

async function loadChatReply(responseToken) {
  const typingDiv = addTypingIndicator();
  try {
    const res = await fetch('/chat/response', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({response_token: responseToken})
    });
    const data = await readChatResponse(res);
    typingDiv.remove();
    if (!res.ok) {
      addMessage('Error: ' + (data.error || 'The AI response failed.'), 'bot');
      return;
    }
    addMessage(data.reply, 'bot');
    chatStatus.textContent = '';
  } catch (err) {
    typingDiv.remove();
    addMessage('The movies are ready, but the assistant message could not load.', 'bot');
    chatStatus.textContent = 'Recommendations are ready. AI message unavailable.';
  }
}

document.querySelectorAll('.mood-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.mood-chip').forEach(item => item.classList.remove('selected'));
    chip.classList.add('selected');
    sendChatMessage(chip.dataset.text);
  });
});

chatForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = '';
  sendChatMessage(text);
});

restoreSession();
</script>
