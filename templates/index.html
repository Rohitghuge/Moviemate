<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MovieMate</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  html, body { scrollbar-width: none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }
  body {
    background: linear-gradient(135deg, #0f9b8e, #142850);
    background-size: 200% 200%;
    min-height: 100vh;
    color: #f5f5f5;
    font-family: 'Segoe UI', sans-serif;
    transition: background 1.2s ease;
    animation: bgPulse 8s ease-in-out infinite, flicker 5.5s ease-in-out infinite;
    overflow-x: hidden;
  }
  @keyframes bgPulse {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @keyframes flicker {
    0%, 100% { filter: brightness(1) saturate(1); }
    50% { filter: brightness(1.18) saturate(1.2); }
  }
  body.mood-love   { background: linear-gradient(135deg, #ff2fb0, #ff7ce8); background-size: 200% 200%; }
  body.mood-happy  { background: linear-gradient(135deg, #00f0ff, #39ff9d); background-size: 200% 200%; }
  body.mood-action { background: linear-gradient(135deg, #ff2e2e, #ff9a00); background-size: 200% 200%; }
  body.mood-horror { background: linear-gradient(135deg, #b026ff, #ff00e5); background-size: 200% 200%; }

  .deco-shape {
    position: fixed; color: rgba(255,255,255,0.28); pointer-events: none;
    animation: floatShape 8s ease-in-out infinite; z-index: 0;
  }
  .shape1 { top: 8%; left: 4%; font-size: 20px; animation-delay: 0s; }
  .shape2 { top: 14%; right: 6%; font-size: 13px; animation-delay: 1.5s; }
  .shape3 { bottom: 18%; left: 8%; font-size: 13px; animation-delay: 3s; }
  .shape4 { bottom: 10%; right: 7%; font-size: 20px; animation-delay: 4.5s; }
  @keyframes floatShape {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }

  .app-wrap { max-width: 1080px; margin: 0 auto; padding: 20px 14px; position: relative; z-index: 1; }
  .brand { text-align: center; margin-bottom: 20px; }
  .brand h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 2.8rem;
    color: #ff5fc1;
    text-shadow: 0 0 20px rgba(255,110,199,0.75), 0 0 44px rgba(255,110,199,0.35);
    margin-bottom: 6px;
  }
  .brand p { letter-spacing: 3px; font-size: 0.8rem; color: rgba(255,255,255,0.65); text-transform: uppercase; }

  .card-glass {
    background: rgba(20, 20, 40, 0.45);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 18px;
    backdrop-filter: blur(8px);
    animation: fadeInUp 0.6s ease;
  }
  .workspace { display: flex; gap: 18px; align-items: flex-start; }
  .main-column { flex: 1 1 800px; min-width: 0; }
  .watchlist-panel {
    display: none; order: -1; flex: 0 0 255px; position: sticky; top: 20px; max-height: calc(100vh - 40px);
    overflow-y: auto; padding: 16px; background: rgba(20, 20, 40, 0.5);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 16px; backdrop-filter: blur(8px);
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.04) transparent;
  }
  .watchlist-panel.visible { display: block; }
  .watchlist-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .watchlist-heading h2 { font-size: 1rem; margin: 0; }
  .watchlist-count { min-width: 22px; padding: 2px 7px; border-radius: 12px; background: rgba(255,255,255,0.14); text-align: center; font-size: 11px; }
  .watchlist-empty { color: rgba(255,255,255,0.6); font-size: 12px; line-height: 1.45; }
  .watchlist-item { display: flex; gap: 9px; padding: 9px 0; border-top: 1px solid rgba(255,255,255,0.1); }
  .watchlist-item img, .watchlist-no-poster { width: 44px; height: 62px; flex: 0 0 44px; object-fit: cover; border-radius: 5px; background: rgba(255,255,255,0.1); }
  .watchlist-no-poster { display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.5); font-size: 9px; text-align: center; }
  .watchlist-item-content { min-width: 0; flex: 1; }
  .watchlist-item-title { font-size: 12px; font-weight: 700; line-height: 1.25; margin-bottom: 4px; }
  .watchlist-item-meta { color: rgba(255,255,255,0.6); font-size: 10px; margin-bottom: 6px; }
  .watchlist-remove { padding: 2px 6px; border: 1px solid rgba(255,255,255,0.2); border-radius: 5px; background: transparent; color: rgba(255,255,255,0.75); font-size: 10px; }
  .watchlist-remove:hover { background: rgba(255,255,255,0.12); }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .auth-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab-btn {
    flex: 1; padding: 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06); color: #f5f5f5; font-weight: 600; transition: all 0.2s ease;
  }
  .tab-btn.active { background: #7b5cff; border-color: #7b5cff; }

  .location-btn {
    width: 100%; padding: 9px; border-radius: 30px;
    border: 1px solid rgba(157,140,255,0.5);
    background: rgba(157,140,255,0.12);
    color: #d9d2ff; font-weight: 600; transition: all 0.25s ease;
  }
  .location-btn:hover { background: rgba(157,140,255,0.22); }
  .location-btn.detecting { animation: pulseGlow 1.2s infinite; }
  .location-btn.detected { background: rgba(56,255,157,0.15); border-color: #38ff9d; color: #c9ffe4; }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 0px rgba(157,140,255,0.4); }
    50% { box-shadow: 0 0 14px rgba(157,140,255,0.7); }
  }

  #chat-window {
    height: 480px; overflow-y: auto; padding: 10px;
    display: flex; flex-direction: column; gap: 12px;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.04) transparent;
  }
  #chat-window::-webkit-scrollbar, .movie-grid::-webkit-scrollbar, .watchlist-panel::-webkit-scrollbar { width: 8px; height: 8px; }
  #chat-window::-webkit-scrollbar-track, .movie-grid::-webkit-scrollbar-track, .watchlist-panel::-webkit-scrollbar-track { background: transparent; }
  #chat-window::-webkit-scrollbar-thumb, .movie-grid::-webkit-scrollbar-thumb, .watchlist-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.04); border-radius: 10px; }
  #chat-window::-webkit-scrollbar-thumb:hover, .movie-grid::-webkit-scrollbar-thumb:hover, .watchlist-panel::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.08); }

  .msg {
    max-width: 85%; padding: 10px 14px; border-radius: 14px;
    white-space: pre-wrap; line-height: 1.4; font-size: 14.5px;
    animation: fadeInUp 0.35s ease;
  }
  .msg.user { align-self: flex-end; background: #7b5cff; color: white; border-bottom-right-radius: 4px; }
  .msg.bot  { align-self: flex-start; background: rgba(255,255,255,0.1); border-bottom-left-radius: 4px; }
  .msg.bot strong { font-size: 1.1em; color: #ffd6f0; }
  .msg.bot a { color: #9d8cff; text-decoration: none; }
  .msg.bot a:hover { color: #ff6ec7; }
  .msg.bot .no-trailer { opacity: 0.5; font-style: italic; }

  .trailer-meta { font-size: 11px; opacity: 0.65; margin: 2px 0 2px 4px; }
  .inline-seen-btn {
    font-size: 10px; padding: 2px 9px; border-radius: 6px; margin-left: 4px;
    border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #f5f5f5;
    transition: transform 0.15s ease;
  }
  .inline-seen-btn:hover { transform: scale(1.05); }
  .inline-seen-btn.excluded { opacity: 0.4; }

  .movie-grid {
    display: flex; gap: 12px; overflow-x: auto; padding: 6px 2px 12px 2px;
    width: 100%; min-width: 0; align-self: stretch; animation: fadeInUp 0.4s ease;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.04) transparent;
  }
  .movie-result-group {
    width: 100%; min-width: 0; flex: 0 0 auto;
  }
  .movie-result-label {
    margin: 0 2px 2px; color: rgba(255,255,255,0.6); font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .movie-card {
    flex: 0 0 135px; width: 135px; min-width: 135px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px; overflow: hidden; font-size: 11.5px;
    transition: transform 0.2s ease;
  }
  .movie-card:hover { transform: translateY(-4px); }
  .poster-wrap { position: relative; }
  .poster-wrap img { width: 100%; height: 180px; object-fit: cover; display: block; background: rgba(255,255,255,0.08); }
  .poster-wrap .no-poster {
    width: 100%; height: 180px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.4); text-align: center; padding: 6px; font-size: 10px;
  }
  .cert-badge {
    position: absolute; top: 6px; right: 6px; font-size: 9px; font-weight: 700;
    padding: 2px 6px; border-radius: 5px; color: white;
  }
  .cert-badge.cert-green { background: #2ecc71; }
  .cert-badge.cert-orange { background: #f39c12; }
  .cert-badge.cert-red { background: #e74c3c; }
  .card-body { padding: 8px 9px; }
  .card-title { font-weight: 700; margin-bottom: 3px; line-height: 1.25; max-height: 2.5em; overflow: hidden; }
  .card-overview { color: rgba(255,255,255,0.68); line-height: 1.35; margin-bottom: 7px; height: 2.7em; overflow: hidden; }
  .card-genres { opacity: 0.6; font-size: 10px; margin-bottom: 5px; max-height: 1.3em; overflow: hidden; }
  .card-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 10.5px; }
  .card-meta .rating { color: #ffd166; font-weight: 700; }
  .card-meta .platform { opacity: 0.7; max-width: 65px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-actions { display: flex; gap: 4px; }
  .card-actions a, .card-actions button, .card-actions .trailer-control {
    flex: 1; font-size: 9.5px; text-align: center; padding: 4px 0; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #f5f5f5;
    text-decoration: none; transition: transform 0.15s ease;
  }
  .card-actions a:hover, .card-actions button:hover, .card-actions .trailer-control:hover { transform: scale(1.05); background: rgba(255,255,255,0.16); }
  .card-actions .no-trailer-btn { opacity: 0.35; pointer-events: none; }
  .movie-card.excluded { opacity: 0.35; }

  .mood-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .mood-chip {
    --chip-color: #9d8cff;
    font-size: 11.5px; padding: 5px 12px; border-radius: 20px;
    border: 1px solid color-mix(in srgb, var(--chip-color) 65%, white 35%);
    background: color-mix(in srgb, var(--chip-color) 16%, transparent);
    color: #fff; transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  .mood-chip:hover, .mood-chip:focus-visible {
    transform: translateY(-1px);
    background: color-mix(in srgb, var(--chip-color) 30%, transparent);
    box-shadow: 0 0 14px color-mix(in srgb, var(--chip-color) 55%, transparent);
  }
  .mood-chip[data-text*="happy"] { --chip-color: #FFD166; }
  .mood-chip[data-text*="sad"] { --chip-color: #6EA8FE; }
  .mood-chip[data-text*="action"] { --chip-color: #FF5A36; }
  .mood-chip[data-text*="romantic"] { --chip-color: #FF6FB5; }
  .mood-chip[data-text*="horror"] { --chip-color: #9B5DE5; }
  .mood-chip[data-text*="Surprise me"] { --chip-color: #2EC4B6; }

  .typing-dots { align-self: flex-start; display: flex; gap: 4px; padding: 10px 14px; }
  .typing-dots span {
    width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.6);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  #chat-form { display: none; }
  .form-control { background: rgba(255,255,255,0.08); color: white; border: 1px solid rgba(255,255,255,0.2); }
  .form-control:focus { background: rgba(255,255,255,0.12); color: white; box-shadow: none; border-color: #7b5cff; }
  .btn-primary { background: #7b5cff; border: none; transition: transform 0.15s ease, background 0.15s ease; }
  .btn-primary:hover { background: #6a4ce0; transform: scale(1.03); }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; }
  .chat-status { min-height: 18px; color: rgba(255,255,255,0.72); font-size: 12px; margin: 0 12px 4px; }
  .empty-results { align-self: stretch; padding: 16px; border: 1px dashed rgba(255,255,255,0.25); border-radius: 12px; color: rgba(255,255,255,0.75); font-size: 13px; }
  .logout-btn {
    font-size: 11px; padding: 3px 10px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #f5f5f5;
  }
  @media (max-width: 576px) {
    .app-wrap { padding: 20px 10px; }
    .card-glass { padding: 16px; }
    #chat-window { height: min(62vh, 520px); padding: 8px 4px; }
    .msg { max-width: 92%; }
    .movie-card { flex-basis: 128px; width: 128px; min-width: 128px; }
    .poster-wrap img, .poster-wrap .no-poster { height: 170px; }
  }
  @media (max-width: 860px) {
    .workspace { display: block; }
    .watchlist-panel { position: static; max-height: none; margin-top: 18px; }
  }
  @media (min-width: 861px) and (max-width: 1180px) {
    .app-wrap { padding-left: 14px; padding-right: 14px; }
    .watchlist-panel { flex-basis: 220px; }
    .movie-card { flex-basis: 133px; width: 133px; min-width: 133px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div class="deco-shape shape1">&#10052;</div>
<div class="deco-shape shape2">&#9675;</div>
<div class="deco-shape shape3">&#9675;</div>
<div class="deco-shape shape4">&#10052;</div>

<div class="app-wrap">
  <div class="brand">
    <h1>MovieMate</h1>
    <p>Find the right movie for every mood</p>
  </div>

  <div class="workspace">
  <main class="main-column">
  <div class="card-glass" id="auth-card">
    <div class="auth-tabs">
      <button type="button" class="tab-btn active" data-tab="login">Log In</button>
      <button type="button" class="tab-btn" data-tab="signup">Sign Up</button>
    </div>

    <form id="login-form" class="auth-form">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" id="login-username" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="login-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Log In</button>
      <div id="login-error" class="text-danger mt-2" style="display:none;"></div>
      <p class="text-center mt-2" style="font-size:12px;">
        <a href="#" id="forgot-link" style="color:#9d8cff; text-decoration:none;">Forgot password?</a>
      </p>
    </form>

    <form id="signup-form" class="auth-form" style="display:none;">
      <div class="mb-3">
        <label class="form-label">Choose a username</label>
        <input type="text" class="form-control" id="signup-username" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Choose a password</label>
        <input type="password" class="form-control" id="signup-password" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Your age</label>
        <input type="number" class="form-control" id="signup-age" min="1" max="120" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Security question (for password recovery)</label>
        <select class="form-control" id="signup-question" required>
          <option value="">Select a question</option>
          <option>What is your pet's name?</option>
          <option>What is your mother's maiden name?</option>
          <option>What was the name of your first school?</option>
          <option>What is your favorite movie?</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Answer</label>
        <input type="text" class="form-control" id="signup-answer" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign Up</button>
      <div id="signup-error" class="text-danger mt-2" style="display:none;"></div>
    </form>
  </div>

  <div class="card-glass" id="forgot-card" style="display:none;">
    <h6 class="mb-3">Reset Password</h6>
    <form id="forgot-step1-form">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" id="forgot-username" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Get Security Question</button>
      <div id="forgot-step1-error" class="text-danger mt-2" style="display:none;"></div>
    </form>

    <form id="forgot-step2-form" style="display:none;">
      <p id="forgot-question-text" class="mb-2" style="font-weight:600;"></p>
      <div class="mb-3">
        <label class="form-label">Your Answer</label>
        <input type="text" class="form-control" id="forgot-answer" required>
      </div>
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" class="form-control" id="forgot-new-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Reset Password</button>
      <div id="forgot-step2-error" class="text-danger mt-2" style="display:none;"></div>
      <div id="forgot-success" class="text-success mt-2" style="display:none;"></div>
    </form>

    <button type="button" id="back-to-login-btn" class="btn btn-outline-light w-100 mt-3" style="font-size:12px;">Back to Log In</button>
  </div>

  <div class="card-glass" id="setup-card" style="display:none;">
    <p class="mb-3">Welcome, <strong id="welcome-username"></strong>!</p>
    <form id="travel-form">
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="travel-input">
        <label class="form-check-label" for="travel-input">I'm travelling / on the go right now</label>
      </div>
      <button type="button" id="location-btn" class="location-btn mb-3">Enable Location</button>
      <button type="submit" class="btn btn-primary w-100">Start Chatting</button>
    </form>
  </div>

  <div class="card-glass" id="chat-card" style="display:none;">
    <div class="top-bar">
      <span>Logged in as <strong id="chat-username"></strong></span>
      <button type="button" id="logout-btn" class="logout-btn">Log Out</button>
    </div>
    <div id="chat-window" role="log" aria-live="polite" aria-label="MovieMate conversation"></div>
    <div id="chat-status" class="chat-status" role="status" aria-live="polite"></div>
    <div class="mood-chips">
      <button type="button" class="mood-chip" data-text="I'm feeling happy, suggest something fun and feel-good">😊 Happy</button>
      <button type="button" class="mood-chip" data-text="I'm feeling sad, suggest something comforting">😢 Sad</button>
      <button type="button" class="mood-chip" data-text="Suggest an intense action movie">💥 Action</button>
      <button type="button" class="mood-chip" data-text="Suggest a romantic movie">❤️ Romance</button>
      <button type="button" class="mood-chip" data-text="Suggest a horror movie">👻 Horror</button>
      <button type="button" class="mood-chip" data-text="Surprise me with something great">🎲 Surprise Me</button>
    </div>
    <form id="chat-form" class="d-flex gap-2 mt-3">
      <input type="text" id="chat-input" class="form-control" placeholder="What are you in the mood to watch?" autocomplete="off">
      <button type="submit" class="btn btn-primary">Send</button>
    </form>
  </div>
  </main>

  <aside id="watchlist-panel" class="watchlist-panel" aria-label="Your watchlist">
    <div class="watchlist-heading">
      <h2>My Watchlist</h2>
      <span id="watchlist-count" class="watchlist-count">0</span>
    </div>
    <div id="watchlist-items">
      <p class="watchlist-empty">Save movies here while you browse. They will stay with your account.</p>
    </div>
  </aside>
  </div>
</div>

<script>
const authCard = document.getElementById('auth-card');
const setupCard = document.getElementById('setup-card');
const chatCard = document.getElementById('chat-card');
const chatForm = document.getElementById('chat-form');
const chatWindow = document.getElementById('chat-window');
const chatInput = document.getElementById('chat-input');
const chatStatus = document.getElementById('chat-status');
const watchlistPanel = document.getElementById('watchlist-panel');
const watchlistItems = document.getElementById('watchlist-items');
const watchlistCount = document.getElementById('watchlist-count');

let travelMode = false;
let currentUsername = null;
let cachedLocationName = null;
const watchlistMovies = new Map();

// ---------- Mood background ----------
const LOVE_WORDS = ["love", "romance", "romantic", "date night"];
const HAPPY_WORDS = ["happy", "feel good", "feelgood", "refreshing", "fun", "cheerful", "uplifting", "funny", "comedy", "lighthearted"];
const ACTION_WORDS = ["action", "fight", "intense", "adrenaline", "war", "battle"];
const HORROR_WORDS = ["horror", "scary", "fear", "spooky", "creepy", "haunted", "thriller"];

function updateMoodBackground(text) {
  const q = text.toLowerCase();
  document.body.classList.remove('mood-love', 'mood-happy', 'mood-action', 'mood-horror');
  if (LOVE_WORDS.some(w => q.includes(w))) document.body.classList.add('mood-love');
  else if (ACTION_WORDS.some(w => q.includes(w))) document.body.classList.add('mood-action');
  else if (HORROR_WORDS.some(w => q.includes(w))) document.body.classList.add('mood-horror');
  else if (HAPPY_WORDS.some(w => q.includes(w))) document.body.classList.add('mood-happy');
}

// ---------- Location ----------
function detectLocation() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        try {
          const { latitude, longitude } = pos.coords;
          const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
          const geoData = await geoRes.json();
          const addr = geoData.address || {};
          const place = addr.city || addr.town || addr.village || addr.state || addr.country || null;
          cachedLocationName = place;
          resolve(place);
        } catch (err) { resolve(null); }
      },
      () => resolve(null),
      { timeout: 8000 }
    );
  });
}

document.getElementById('location-btn').addEventListener('click', async () => {
  const btn = document.getElementById('location-btn');
  btn.classList.add('detecting');
  btn.textContent = 'Detecting...';
  const place = await detectLocation();
  btn.classList.remove('detecting');
  if (place) {
    btn.classList.add('detected');
    btn.textContent = `Location: ${place}`;
  } else {
    btn.textContent = 'Location unavailable — tap to retry';
  }
});

const LOCATION_QUERY_PATTERNS = ["where am i", "my location", "where i am", "current location", "what's my location"];
function isLocationQuery(text) {
  const q = text.toLowerCase();
  return LOCATION_QUERY_PATTERNS.some(p => q.includes(p));
}

function onAuthSuccess(username, state = {}) {
  currentUsername = username;
  travelMode = Boolean(state.travel_mode);
  authCard.style.display = 'none';
  document.getElementById('welcome-username').textContent = username;
  document.getElementById('chat-username').textContent = username;
  document.getElementById('travel-input').checked = travelMode;
  watchlistPanel.classList.add('visible');
  loadWatchlist();
  if (state.has_started) {
    setupCard.style.display = 'none';
    chatCard.style.display = 'block';
    chatForm.style.display = 'flex';
  } else {
    setupCard.style.display = 'block';
  }
}

function renderWatchlist() {
  watchlistCount.textContent = watchlistMovies.size;
  watchlistItems.innerHTML = '';
  if (watchlistMovies.size === 0) {
    const empty = document.createElement('p');
    empty.className = 'watchlist-empty';
    empty.textContent = 'Save movies here while you browse. They will stay with your account.';
    watchlistItems.appendChild(empty);
    return;
  }
  watchlistMovies.forEach(movie => {
    const item = document.createElement('div');
    item.className = 'watchlist-item';
    if (movie.poster_path) {
      const image = document.createElement('img');
      image.src = POSTER_BASE + movie.poster_path;
      image.alt = `${movie.title} poster`;
      image.loading = 'lazy';
      item.appendChild(image);
    } else {
      const noPoster = document.createElement('div');
      noPoster.className = 'watchlist-no-poster';
      noPoster.textContent = 'No image';
      item.appendChild(noPoster);
    }
    const content = document.createElement('div');
    content.className = 'watchlist-item-content';
    const title = document.createElement('div');
    title.className = 'watchlist-item-title';
    title.textContent = movie.title;
    const meta = document.createElement('div');
    meta.className = 'watchlist-item-meta';
    meta.textContent = `${(movie.release_date || '').slice(0, 4) || 'Year n/a'} · ★ ${movie.rating ? Number(movie.rating).toFixed(1) : '–'}`;
    const removeButton = document.createElement('button');
    removeButton.type = 'button';
    removeButton.className = 'watchlist-remove';
    removeButton.textContent = 'Remove';
    removeButton.addEventListener('click', () => removeWatchlistMovie(movie.id));
    content.append(title, meta, removeButton);
    item.appendChild(content);
    watchlistItems.appendChild(item);
  });
}

async function loadWatchlist() {
  try {
    const res = await fetch('/watchlist');
    if (!res.ok) return;
    const data = await readJsonResponse(res);
    watchlistMovies.clear();
    (data.movies || []).forEach(movie => watchlistMovies.set(String(movie.id), movie));
    renderWatchlist();
  } catch (err) {
    console.warn('Could not load watchlist:', err);
  }
}

async function readJsonResponse(res) {
  const contentType = res.headers.get('content-type') || '';
  if (!contentType.includes('application/json')) {
    throw new Error(`Watchlist server error (HTTP ${res.status}). Restart app.py so the new watchlist table and routes load.`);
  }
  return res.json();
}

async function readChatResponse(res) {
  const contentType = res.headers.get('content-type') || '';
  if (!contentType.includes('application/json')) {
    throw new Error(`Server returned HTTP ${res.status}. Check the Render logs for the backend error.`);
  }
  return res.json();
}

async function addWatchlistMovie(movie, button, card) {
  button.disabled = true;
  button.textContent = 'Saving...';
  try {
    const res = await fetch('/watchlist', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(movie)
    });
    const data = await readChatResponse(res);
    if (!res.ok) throw new Error(data.error || 'Could not save this movie.');
    watchlistMovies.set(String(movie.id), movie);
    renderWatchlist();
    card.classList.add('watchlisted');
    button.textContent = 'In list';
  } catch (err) {
    button.disabled = false;
    button.textContent = 'Add to list';
    chatStatus.textContent = err.message || 'Could not save this movie.';
  }
}

async function removeWatchlistMovie(movieId) {
  try {
    const res = await fetch(`/watchlist/${encodeURIComponent(movieId)}`, {method: 'DELETE'});
    const data = await readJsonResponse(res);
    if (!res.ok) throw new Error(data.error || 'Could not remove this movie.');
    watchlistMovies.delete(String(movieId));
    renderWatchlist();
    document.querySelectorAll(`[data-movie-id="${CSS.escape(String(movieId))}"] .watchlist-btn`).forEach(button => {
      button.disabled = false;
      button.textContent = 'Add to list';
    });
  } catch (err) {
    chatStatus.textContent = err.message || 'Could not remove that movie.';
  }
}

async function loadTrailers(movies, grid) {
  try {
    const res = await fetch('/trailers', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({movie_ids: movies.map(movie => movie.id)})
    });
    const data = await readJsonResponse(res);
    if (!res.ok) throw new Error(data.error || 'Could not load trailers.');
    Object.entries(data.trailers || {}).forEach(([movieId, trailerUrl]) => {
      const card = grid.querySelector(`[data-movie-id="${CSS.escape(String(movieId))}"]`);
      const trailerControl = card && card.querySelector('.trailer-control');
      if (!trailerControl) return;
      if (trailerUrl) {
        const trailerLink = document.createElement('a');
        trailerLink.href = trailerUrl;
        trailerLink.target = '_blank';
        trailerLink.rel = 'noopener';
        trailerLink.className = 'trailer-control';
        trailerLink.textContent = '▶ Trailer';
        trailerLink.setAttribute('aria-label', `Watch trailer for ${card.querySelector('.card-title').textContent}`);
        trailerControl.replaceWith(trailerLink);
      } else {
        trailerControl.textContent = 'No trailer';
        trailerControl.classList.add('no-trailer-btn');
      }
    });
  } catch (err) {
    grid.querySelectorAll('.trailer-control').forEach(control => {
      control.textContent = 'Trailer unavailable';
      control.classList.add('no-trailer-btn');
    });
  }
}

async function restoreSession() {
  try {
    const res = await fetch('/session');
    const state = await res.json();
    if (res.ok && state.authenticated) onAuthSuccess(state.username, state);
  } catch (err) {
    console.warn('Could not restore session:', err);
  }
}

  e.preventDefault();
  travelMode = document.getElementById('travel-input').checked;

  startButton.textContent = 'Starting...';

  try {
    const res = await fetch('/start', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({travel_mode: travelMode})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not start the chat.');

    setupCard.style.display = 'none';
    chatCard.style.display = 'block';
    chatForm.style.display = 'flex';
    chatWindow.innerHTML = '';
    addMessage(`Hey ${currentUsername}! Tell me what you're in the mood to watch — or try 'movies like [a movie you love]'.`, 'bot');

    if (travelMode) {
      if (cachedLocationName) {
        addMessage(`I'll keep picks light and easy since you're near ${cachedLocationName} and travelling!`, 'bot');
      } else {
        addMessage("Travel mode is on — I'll keep picks light and easy for your trip!", 'bot');
      }
    }
  } catch (err) {
    chatStatus.textContent = err.message || 'Could not start the chat. Please try again.';
  } finally {
    startButton.disabled = false;
    startButton.textContent = 'Start Chatting';
  }
});

// ---------- Message rendering ----------
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatBotText(text) {
  let out = escapeHtml(text);
  out = out.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/\*(.*?)\*/g, '<em>$1</em>');
  out = out.replace(/\n/g, '<br>');
  return out;
}

function certClass(cert) {
  const c = (cert || '').toUpperCase();
  if (c.includes('18') || c === 'A' || c.includes('NC-17')) return 'cert-red';
  if (c.includes('16') || c.includes('13') || c === 'R') return 'cert-orange';
  return 'cert-green';
}

const POSTER_BASE = "https://image.tmdb.org/t/p/w300";

function addMovieGrid(movies) {
  if (!movies || movies.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-results';
    empty.textContent = 'No new matches came back for that request. Try a broader mood, genre, or title.';
    chatWindow.appendChild(empty);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return;
  }
  const group = document.createElement('section');
  group.className = 'movie-result-group';
  group.setAttribute('aria-label', 'Movie recommendations');
  const label = document.createElement('div');
  label.className = 'movie-result-label';
  label.textContent = 'Recommendations';
  group.appendChild(label);

  const grid = document.createElement('div');
  grid.className = 'movie-grid';

  movies.forEach(m => {
    const card = document.createElement('div');
    card.className = 'movie-card';
    card.dataset.movieId = String(m.id);

    const platform = m.watch_providers ? m.watch_providers.split(',')[0].trim() : 'Not listed';
    const posterWrap = document.createElement('div');
    posterWrap.className = 'poster-wrap';
    if (m.poster_path) {
      const image = document.createElement('img');
      image.src = POSTER_BASE + m.poster_path;
      image.alt = `${m.title || 'Movie'} poster`;
      image.loading = 'lazy';
      posterWrap.appendChild(image);
    } else {
      const noPoster = document.createElement('div');
      noPoster.className = 'no-poster';
      noPoster.textContent = 'No image';
      posterWrap.appendChild(noPoster);
    }
    const badge = document.createElement('span');
    badge.className = `cert-badge ${certClass(m.certification)}`;
    badge.textContent = m.certification || 'NR';
    posterWrap.appendChild(badge);

    const body = document.createElement('div');
    body.className = 'card-body';
    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = m.title || 'Untitled movie';
    const genres = document.createElement('div');
    genres.className = 'card-genres';
    genres.textContent = m.genres || 'Genre not listed';
    const overview = document.createElement('div');
    overview.className = 'card-overview';
    overview.textContent = m.overview || 'A recommendation from your MovieMate catalog.';
    overview.title = m.overview || '';
    const meta = document.createElement('div');
    meta.className = 'card-meta';
    const rating = document.createElement('span');
    rating.className = 'rating';
    rating.textContent = `★ ${m.rating ? Number(m.rating).toFixed(1) : '–'}`;
    const year = document.createElement('span');
    year.textContent = (m.release_date || '').slice(0, 4) || 'Year n/a';
    meta.append(rating, year);
    const provider = document.createElement('div');
    provider.className = 'card-genres';
    provider.textContent = `Watch in India: ${platform}`;
    const actions = document.createElement('div');
    actions.className = 'card-actions';
    const trailer = document.createElement('span');
    trailer.className = 'trailer-control';
    trailer.textContent = 'Loading trailer...';
    actions.appendChild(trailer);
    const watchlistButton = document.createElement('button');
    watchlistButton.type = 'button';
    watchlistButton.className = 'watchlist-btn';
    watchlistButton.textContent = watchlistMovies.has(String(m.id)) ? 'In list' : 'Add to list';
    watchlistButton.disabled = watchlistMovies.has(String(m.id));
    watchlistButton.addEventListener('click', () => addWatchlistMovie(m, watchlistButton, card));
    actions.appendChild(watchlistButton);
    const seenButton = document.createElement('button');
    seenButton.type = 'button';
    seenButton.className = 'seen-btn';
    seenButton.textContent = 'Seen it';
    seenButton.addEventListener('click', async () => {
      seenButton.disabled = true;
      seenButton.textContent = 'Saving...';
      try {
        const res = await fetch('/exclude', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({movie_id: m.id, movie_title: m.title})
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not save this movie.');
        card.classList.add('excluded');
        seenButton.textContent = 'Seen';
      } catch (err) {
        seenButton.disabled = false;
        seenButton.textContent = 'Try again';
        chatStatus.textContent = err.message || 'Could not save that movie.';
      }
    });
    actions.appendChild(seenButton);
    body.append(title, genres, overview, meta, provider, actions);
    card.append(posterWrap, body);

    grid.appendChild(card);
  });

  group.appendChild(grid);
  chatWindow.appendChild(group);
  chatWindow.scrollTop = chatWindow.scrollHeight;
  loadTrailers(movies, grid);
}

function addMessage(text, sender) {
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  if (sender === 'bot') {
    div.innerHTML = formatBotText(text);
  } else {
    div.textContent = text;
  }
  chatWindow.appendChild(div);
  chatWindow.scrollTop = chatWindow.scrollHeight;
  return div;
}

function addTypingIndicator() {
  const div = document.createElement('div');
  div.className = 'typing-dots';
  div.innerHTML = '<span></span><span></span><span></span>';
  chatWindow.appendChild(div);
  chatWindow.scrollTop = chatWindow.scrollHeight;
  return div;
}

async function sendChatMessage(text) {
  addMessage(text, 'user');
  updateMoodBackground(text);

  if (isLocationQuery(text)) {
    const typingDiv = addTypingIndicator();
    const place = cachedLocationName || await detectLocation();
    typingDiv.remove();
    if (place) {
      addMessage(`You're currently near ${place}.`, 'bot');
    } else {
      addMessage("I couldn't detect your location — make sure location access is allowed for this site in your browser settings, then ask again.", 'bot');
    }
    return;
  }

  const sendBtn = chatForm.querySelector('button[type="submit"]');
  sendBtn.disabled = true;
  sendBtn.textContent = '...';
  chatStatus.textContent = 'Finding a few good matches...';

  const typingDiv = addTypingIndicator();

  try {
    const res = await fetch('/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });
    const data = await readJsonResponse(res);
    typingDiv.remove();

    if (!res.ok) {
      addMessage('Error: ' + (data.error || 'Something went wrong.'), 'bot');
      return;
    }

    addMovieGrid(data.movies);
    if (data.blocked_count && (!data.movies || data.movies.length === 0)) {
      chatStatus.textContent = 'Some matches were filtered by your age setting or previous Seen it choices.';
    } else {
      chatStatus.textContent = 'Movies found. Writing your personal note...';
    }
    await loadChatReply(data.response_token);
  } catch (err) {
    typingDiv.remove();
    addMessage(`Error: ${err.message || 'The request failed.'}`, 'bot');
    chatStatus.textContent = 'The chat request failed. Check the Render logs for details.';
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = 'Send';
  }
}

async function loadChatReply(responseToken) {
  const typingDiv = addTypingIndicator();
  try {
    const res = await fetch('/chat/response', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({response_token: responseToken})
    });
    const data = await readChatResponse(res);
    typingDiv.remove();
    if (!res.ok) {
      addMessage('Error: ' + (data.error || 'The AI response failed.'), 'bot');
      return;
    }
    addMessage(data.reply, 'bot');
    chatStatus.textContent = '';
  } catch (err) {
    typingDiv.remove();
    addMessage('The movies are ready, but the assistant message could not load.', 'bot');
    chatStatus.textContent = 'Recommendations are ready. AI message unavailable.';
  }
}

document.querySelectorAll('.mood-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    sendChatMessage(chip.dataset.text);
  });
});

chatForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = '';
  sendChatMessage(text);
});

restoreSession();
